<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>司法院裁判書查詢進度</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .progress-wrap{max-width:960px;margin:32px auto;padding:24px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}
    .progress-track{height:16px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:16px 0}
    .progress-bar{height:100%;width:0;background:linear-gradient(90deg,#0284c7,#14b8a6);transition:width .5s ease}
    .query-card{margin-top:24px;padding:20px;border:1px solid #cbd5e1;border-radius:12px}
    .query-card h2{margin-top:0}.status{color:#475569}.error{color:#b91c1c}
    .actions a{display:inline-block;margin:6px 10px 0 0;padding:8px 14px;background:#075985;color:#fff;border-radius:7px;text-decoration:none}
    .case-list{width:100%;border-collapse:collapse;margin-top:14px}.case-list th,.case-list td{padding:9px;border:1px solid #dbe3ea;text-align:left}
  </style>
</head>
<body>
  <header class="site-header"><h1>司法院裁判書查詢</h1><p class="subtitle">{{ company_name }}／{{ person_name }}</p></header>
  <main class="progress-wrap">
    <h2 id="progressText">準備連線司法院裁判書系統</h2>
    <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
    <p id="progressPercent" class="status">0%</p>
    <div id="results"></div>
  </main>
  <script>
    const config = {{ {
      "company_name": company_name,
      "person_name": person_name,
      "date_from": date_from,
      "date_to": date_to,
      "step_url": url_for('fjud_search_step')
    } | tojson }};
    const keywords = ["賄賂", "政治獻金"];
    const blobs = [];
    function progress(value, text){
      document.getElementById('progressBar').style.width=value+'%';
      document.getElementById('progressPercent').textContent=value+'%';
      document.getElementById('progressText').textContent=text;
    }
    function imageUrl(encoded){
      const raw=atob(encoded), bytes=new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
      const url=URL.createObjectURL(new Blob([bytes],{type:'image/png'})); blobs.push(url); return url;
    }
    function openPrintPage(imageSrc, pageTitle){
      const printWindow=window.open('', '_blank');
      if(!printWindow){
        alert('瀏覽器封鎖了列印視窗，請允許本網站開啟彈出式視窗後再試一次。');
        return;
      }
      const doc=printWindow.document;
      doc.open();
      doc.write(`<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><title>司法院官方查詢結果</title><style>
        @page{size:A4 landscape;margin:0}
        *{box-sizing:border-box}
        html,body{margin:0;padding:0;width:100%;min-height:100%;background:#fff}
        body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
        .toolbar{position:fixed;z-index:10;top:14px;right:14px;display:flex;gap:8px;padding:8px;background:#fffffff0;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 2px 10px #0002}
        .toolbar button{padding:9px 18px;border:0;border-radius:6px;background:#075985;color:#fff;font-size:16px;cursor:pointer}
        .sheet{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
        .sheet img{display:block;width:100%;height:auto;max-width:none}
        @media print{
          html,body{width:297mm;height:210mm;overflow:hidden}
          .toolbar{display:none!important}
          .sheet{width:297mm;height:210mm;min-height:210mm;page-break-after:avoid}
          .sheet img{width:297mm;height:210mm;object-fit:contain;object-position:center center}
        }
      </style></head><body><div class="toolbar"><button type="button" id="printButton">滿版列印</button></div><main class="sheet" id="sheet"></main></body></html>`);
      doc.close();
      doc.title=pageTitle;
      const image=doc.createElement('img');
      image.alt=pageTitle;
      image.src=imageSrc;
      doc.getElementById('sheet').appendChild(image);
      doc.getElementById('printButton').addEventListener('click',()=>printWindow.print());
    }
    function show(data){
      const card=document.createElement('section'); card.className='query-card';
      const title=document.createElement('h2'); title.textContent=`(${config.company_name}+${config.person_name})&${data.keyword}`; card.appendChild(title);
      const meta=document.createElement('p'); meta.className='status'; meta.textContent=`查詢完成：${data.queried_at}｜結果：${data.results.length} 筆`; card.appendChild(meta);
      const actions=document.createElement('div'); actions.className='actions';
      data.evidence_images.forEach((image,i)=>{
        const imageSrc=imageUrl(image);
        const pageLabel=data.evidence_images.length>1?`查看／列印官方結果第 ${i+1} 頁`:'查看／列印官方結果';
        const a=document.createElement('a');
        a.href='#';
        a.textContent=pageLabel;
        a.addEventListener('click',event=>{
          event.preventDefault();
          openPrintPage(imageSrc,`${data.keyword}－${pageLabel}`);
        });
        actions.appendChild(a);
      });
      card.appendChild(actions);
      if(!data.results.length){ const p=document.createElement('p'); p.textContent='司法院回傳：查無符合資料（仍可由上方按鈕開啟官方原始結果畫面）。'; card.appendChild(p); }
      else { const table=document.createElement('table'); table.className='case-list'; table.innerHTML='<thead><tr><th>裁判字號</th><th>日期</th><th>案由</th><th>官方頁面</th></tr></thead>'; const body=document.createElement('tbody'); data.results.forEach(r=>{const tr=document.createElement('tr'); [r.case_number,r.judgment_date||'－',r.case_title||'－'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});const td=document.createElement('td');const a=document.createElement('a');a.href=r.detail_url;a.target='_blank';a.rel='noopener';a.textContent='開啟裁判書';td.appendChild(a);tr.appendChild(td);body.appendChild(tr)});table.appendChild(body);card.appendChild(table); }
      document.getElementById('results').appendChild(card);
    }
    async function run(){
      for(let i=0;i<keywords.length;i++){
        const start=i===0?10:55, waiting=i===0?35:80, done=i===0?50:100;
        progress(start,`正在送出「${keywords[i]}」查詢，完成後將切換再檢索分頁`);
        const timer=setInterval(()=>{const bar=document.getElementById('progressBar');const now=parseInt(bar.style.width)||start;if(now<waiting)progress(now+1,`正在查詢「${keywords[i]}」並準備官方稽核畫面`)},900);
        const body=new URLSearchParams({...config,keyword:keywords[i]}); body.delete('step_url');
        try{
          const response=await fetch(config.step_url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
          const raw=await response.text();
          if(!raw.trim()){
            throw new Error(`伺服器未回傳內容（HTTP ${response.status}）。請查看 Render Log 是否出現 WORKER TIMEOUT、SIGKILL 或記憶體不足。`);
          }
          let data;
          try{data=JSON.parse(raw)}catch(parseError){
            throw new Error(`伺服器回應不是 JSON（HTTP ${response.status}）。請查看 Render Log。`);
          }
          if(!response.ok||!data.ok)throw new Error(data.error||`查詢失敗（HTTP ${response.status}）`);
          show(data);
          progress(done,`${keywords[i]}查詢完成`)
        }catch(e){
          const p=document.createElement('p');p.className='error';p.textContent=`${keywords[i]}：${e.message}`;document.getElementById('results').appendChild(p);progress(done,`${keywords[i]}查詢結束（發生錯誤）`)
        }finally{clearInterval(timer)}
      }
      progress(100,'兩組查詢全部完成，可開啟官方結果頁列印');
    }
    run();
    window.addEventListener('beforeunload',()=>blobs.forEach(URL.revokeObjectURL));
  </script>
</body>
</html>
